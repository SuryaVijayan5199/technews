version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: technews_db
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
      POSTGRES_DB: technews
    ports:
      - "5432:5432"
    volumes:
      - technews_pgdata:/var/lib/postgresql/data

  # Optional: pgAdmin for DB management
  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: technews_pgadmin
    restart: always
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@technews.io
      PGADMIN_DEFAULT_PASSWORD: admin
    ports:
      - "5050:80"
    depends_on:
      - postgres

volumes:
  technews_pgdata:
